services:
  web:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file: [.env]
    environment:
      - PORT=${PORT:-5000}
      - HOST=0.0.0.0
      - SCAN_HOSTS=${SCAN_HOSTS:-localhost,host.docker.internal}
      - SCAN_PORTS=${SCAN_PORTS:-5000,5001,5002,8000,8080,3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["./saas_shop.db:/app/saas_shop.db"]
    restart: unless-stopped
