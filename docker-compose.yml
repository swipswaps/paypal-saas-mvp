services:
  web:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file: [.env]
    environment:
      - PORT=${PORT:-5000}
      - HOST=0.0.0.0
      - ALLOW_SETUP=1
    volumes:
      - ./saas_shop.db:/app/saas_shop.db
      - ./config:/app/config
      - ./static:/app/static
    restart: unless-stopped
