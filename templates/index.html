{% extends "base.html" %}{% block content %}
<div class="card"><h1>{{ BRAND_NAME }}</h1>
<p>{{ BRAND_TAGLINE }}</p>
<p><a class="btn" href="{{ url_for('register') }}">Create an account</a>
<a class="btn secondary" href="{{ url_for('login') }}">Log in</a></p></div>
<div class="card"><h2>Plans</h2><ul>
{% for key, p in plans.items() %}<li><strong>{{ p.name }}</strong> — {{ CURRENCY_SYMBOL }}{{ p.price }}/month</li>{% endfor %}
</ul></div>
<div class="card" id="docker-status"><h3>Docker detection</h3>
<p id="docker-msg">Checking <code>/health</code>…</p></div>
<script>fetch('/health').then(r=>r.ok?r.json():Promise.reject()).then(j=>{document.getElementById('docker-msg').textContent='Docker/container backend detected — '+j.status+'.';}).catch(()=>{document.getElementById('docker-msg').innerHTML='No container detected. Run <code>docker compose up --build -d</code> or <code>python app.py</code>.';});</script>
{% endblock %}
