{% extends "base.html" %}{% block content %}
<div class="card"><h2>Create account</h2>{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><label>Email<input name="email" type="email" required></label>
<label>Password<input name="password" type="password" minlength="8" required></label>
<button class="btn" type="submit">Register</button></form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>
{% endblock %}
